<!DOCTYPE html>
<html lang="en" class="dark:bg-red-500 bg-blue-500">
<head>
    <meta charset=" UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Mode Playground</title>
<!-- <link rel="stylesheet" href="./src/output.css"> -->
</head>

<script>
        // On page load or when changing themes, best to add inline in `head` to avoid FOUC
    document.documentElement.classList.toggle(
        "dark",
        localStorage.theme === "dark" ||
        (!("theme" in localStorage) && window.matchMedia("(prefers-color-scheme: dark)").matches),
    );
</script>


<body>

      <div class="flex justify-center items-center gap-4 mt-4">
        <!-- button for lightmode -->
        <button id="btn-light" class="w-32 h-12 p-2 bg-red-300 rounded-2xl ">
            Light Mode
        </button>
        <!-- button for darkmode -->
        <button id="btn-dark" class="w-32 h-12 p-2 bg-blue-300 rounded-2xl ">
            Dark Mode
        </button>
      </div>
</body>

<script>
    // implemetation logic to change darkmode
    document.getElementById('btn-dark').addEventListener('click',
        ()=>{

            document.documentElement.classList.add('dark');
            // alert(addDark);
            localStorage.setItem('theme', 'dark');
        }
    )

    // implementation logic to change lightmode
    document.getElementById('btn-light').addEventListener('click',
        ()=>{
            document.documentElement.classList.remove('dark');
            localStorage.setItem('theme', 'light');
        }
    )
</script>

</html>
